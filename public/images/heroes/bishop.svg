<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bishopBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <linearGradient id="holyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bishopBg)"/>
  <circle cx="200" cy="180" r="140" fill="#fef08a" opacity="0.15"/>
  <circle cx="200" cy="180" r="120" fill="none" stroke="url(#holyGlow)" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- Sunburst Rays -->
  <g stroke="url(#holyGlow)" stroke-width="3" opacity="0.7">
    <line x1="200" y1="40" x2="200" y2="70"/>
    <line x1="200" y1="290" x2="200" y2="320"/>
    <line x1="60" y1="180" x2="90" y2="180"/>
    <line x1="310" y1="180" x2="340" y2="180"/>
    <line x1="100" y1="80" x2="120" y2="100"/>
    <line x1="280" y1="260" x2="300" y2="280"/>
    <line x1="300" y1="80" x2="280" y2="100"/>
    <line x1="100" y1="280" x2="120" y2="260"/>
  </g>
  <!-- Sacred Holy Mitre & Cross -->
  <path d="M150 250 L150 160 Q200 90 200 90 Q200 90 250 160 L250 250 Z" fill="#ffffff" stroke="url(#holyGlow)" stroke-width="5"/>
  <path d="M185 130 L215 130 M200 115 L200 165" stroke="url(#holyGlow)" stroke-width="6" stroke-linecap="round"/>
  <!-- Sacred Book Base -->
  <rect x="140" y="240" width="120" height="30" rx="6" fill="url(#holyGlow)"/>
  <text x="200" y="360" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3">BISHOP</text>
</svg>

