<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="100" y1="50" x2="400" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background Container with Rounded Squircle -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Shield Base -->
  <path d="M256 70 L380 130 C380 270 340 370 256 425 C172 370 132 270 132 130 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Inner Crest Shield -->
  <path d="M256 95 L355 145 C355 260 322 345 256 395 C190 345 157 260 157 145 Z" fill="#1e1b4b" opacity="0.6" />

  <!-- Golden Crossed Blades -->
  <!-- Left Sword -->
  <path d="M165 350 L347 168 L360 181 L178 363 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M150 365 L175 340 L180 375 Z" fill="#f59e0b" />
  <!-- Right Sword -->
  <path d="M347 350 L165 168 L152 181 L334 363 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M362 365 L337 340 L332 375 Z" fill="#f59e0b" />

  <!-- Central Crown Emblem -->
  <path d="M196 230 L220 280 L256 215 L292 280 L316 230 L326 295 L186 295 Z" fill="url(#goldGrad)" filter="url(#glow)" stroke="#fef08a" stroke-width="3" />

  <!-- Crown Base Gem -->
  <circle cx="256" cy="275" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
  <circle cx="218" cy="280" r="6" fill="#f43f5e" />
  <circle cx="294" cy="280" r="6" fill="#10b981" />

  <!-- Top Hero Winged Crest -->
  <path d="M256 125 L272 155 L305 160 L280 182 L288 215 L256 196 L224 215 L232 182 L207 160 L240 155 Z" fill="#fef08a" />
</svg>
